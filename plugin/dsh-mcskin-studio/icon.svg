<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Minecraft Skin Studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3a4a"/>
      <stop offset="1" stop-color="#1b222c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <g shape-rendering="crispEdges">
    <!-- head -->
    <rect x="24" y="12" width="16" height="14" fill="#e8b48a"/>
    <rect x="24" y="12" width="16" height="5" fill="#6b4a2f"/>
    <rect x="27" y="20" width="3" height="3" fill="#ffffff"/>
    <rect x="34" y="20" width="3" height="3" fill="#ffffff"/>
    <rect x="28" y="21" width="1" height="2" fill="#3f70c8"/>
    <rect x="35" y="21" width="1" height="2" fill="#3f70c8"/>
    <!-- body -->
    <rect x="22" y="27" width="20" height="18" fill="#3f8f5f"/>
    <rect x="22" y="40" width="20" height="5" fill="#2a6341"/>
    <!-- arms -->
    <rect x="13" y="27" width="8" height="18" fill="#34774f"/>
    <rect x="43" y="27" width="8" height="18" fill="#34774f"/>
    <rect x="13" y="38" width="8" height="7" fill="#e8b48a"/>
    <rect x="43" y="38" width="8" height="7" fill="#e8b48a"/>
    <!-- legs -->
    <rect x="24" y="46" width="7" height="12" fill="#4a5a78"/>
    <rect x="33" y="46" width="7" height="12" fill="#4a5a78"/>
    <rect x="24" y="54" width="7" height="4" fill="#6b6b73"/>
    <rect x="33" y="54" width="7" height="4" fill="#6b6b73"/>
  </g>
</svg>
